<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="supported-color-schemes" content="light dark" />
    <title>Confirm your new email address</title>
    <style>
        :root {
            color-scheme: light dark;
            supported-color-schemes: light dark;
        }

        body, table, td, p, a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        body {
            margin: 0;
            padding: 0;
            width: 100% !important;
            background-color: #f3f4f6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: #111827;
        }

        @media (prefers-color-scheme: dark) {
            body, .email-bg {
                background-color: #0b0f17 !important;
            }
            .email-card {
                background-color: #131926 !important;
                border-color: #242e42 !important;
            }
            .heading {
                color: #f9fafb !important;
            }
            .body-text {
                color: #9ca3af !important;
            }
            .highlight-email {
                color: #e5e7eb !important;
            }
            .divider {
                border-top-color: #242e42 !important;
            }
            .footer-text {
                color: #6b7280 !important;
            }
        }
    </style>
</head>
<body class="email-bg" style="margin:0; padding:0; background-color:#f3f4f6;">
<div style="display:none; max-height:0; overflow:hidden; mso-hide:all;">
    Someone logged into your account
</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="email-bg" style="background-color:#f3f4f6; padding: 40px 16px;">
    <tr>
        <td align="center">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" class="email-card" style="max-width:520px; background-color:#ffffff; border:1px solid #e5e7eb; border-radius:16px; overflow:hidden; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);">

                <tr>
                    <td style="height:4px; background: #10b981 linear-gradient(90deg, #10b981, #3b82f6);font-size:0; line-height:0;">&nbsp;</td>
                </tr>

                <tr>
                    <td style="padding: 36px 32px 0 32px;">
                        <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin-bottom: 24px;">
                            <tr>
                                <td style="background-color:#10b9811a; border:1px solid #10b98140; border-radius:8px; padding:6px 12px; font-size:13px; font-weight:700; letter-spacing:0.04em; color:#10b981;">
                                    MCAuth
                                </td>
                            </tr>
                        </table>

                        <h1 class="heading" style="margin:0 0 12px 0; font-size:22px; font-weight:700; line-height:1.3; color:#111827;">
                            New login
                        </h1>

                        <p class="body-text" style="font-size:15px; line-height:1.6; color:#4b5563;">
                            Browser: <strong class="highlight-email" style="color:#374151;">{{.browser}}</strong>
                        </p>

                        <p class="body-text" style="font-size:15px; line-height:1.6; color:#4b5563;">
                            OS: <strong class="highlight-email" style="color:#374151;">{{.os}}</strong>
                        </p>

                        <p class="body-text" style="font-size:15px; line-height:1.6; color:#4b5563;">
                            Device: <strong class="highlight-email" style="color:#374151;">{{.device}}</strong>
                        </p>

                        <p class="body-text" style="font-size:15px; line-height:1.6; color:#4b5563;">
                            IP: <strong class="highlight-email" style="color:#374151;">{{.ip}}</strong>
                        </p>
                    </td>
                </tr>

                <tr>
                    <td class="divider" style="border-top:1px solid #f3f4f6; padding: 20px 32px;">
                        <p class="footer-text" style="margin:0; font-size:12px; line-height:1.5; color:#9ca3af;">
                            Sent automatically by MCAuth. If this wasn't you, change your password immediately
                        </p>
                    </td>
                </tr>

            </table>
        </td>
    </tr>
</table>
</body>
</html>
